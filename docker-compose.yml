services:
  db:
    image: postgres:17-alpine
    container_name: hubmi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hubmi}
      POSTGRES_USER: ${POSTGRES_USER:-hubmi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hubmi}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hubmi} -d ${POSTGRES_DB:-hubmi}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  landing:
    build:
      context: ./landing
    container_name: hubmi-landing
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
