# HubMI — docker compose (prod/Coolify-ready)
#
# Local dev: cp docker-compose.override.yml.example docker-compose.override.yml
#            + ustaw DJANGO_DEBUG=1 w .env (debug domyślnie WYŁĄCZONY)
#
# Coolify: bez container_name i bez top-level `name` (Coolify zarządza nazwami),
#          publiczny wpis = serwis `web` (port 80), reszta wewnętrzna w sieci compose.

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hubmi}
      POSTGRES_USER: ${POSTGRES_USER:-hubmi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hubmi}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/sql/001_extensions.sql:/docker-entrypoint-initdb.d/001_extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hubmi} -d ${POSTGRES_DB:-hubmi}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?ustaw DJANGO_SECRET_KEY w env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-hubmi}
      DB_USER: ${POSTGRES_USER:-hubmi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-hubmi}
      # --- AI: wyłącznie Jev (Decisions API OpenRouter) ---------------------
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_URL: ${JEV_URL:-https://openrouter.ai/api/alpha/decisions}
      JEV_MODEL: ${JEV_MODEL:-typesafe/jev-1.13}
      JEV_THRESHOLD: ${JEV_THRESHOLD:-0.5}
      AI_PROVIDER: ${AI_PROVIDER:-jev}
      AI_TIMEOUT: ${AI_TIMEOUT:-30}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      # dane ROPS montowane z hosta (read-only — źródło prawdy to data/)
      ROPS_DATA_DIR: /srv/data
      APP_DATA_DIR: /srv/app_data
    volumes:
      - ./data:/srv/data:ro
      - ./app/src/data:/srv/app_data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
