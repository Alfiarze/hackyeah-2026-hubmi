<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 296" role="img" aria-label="Schemat: przeglądarka mieszkańca łączy się z Django REST na komputerze GB10 w serwerowni ROPS; tam działa silnik rankingu BM25, baza PostgreSQL z pgvector i model decyzyjny Kev. Nic nie wychodzi poza serwerownię.">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#16756c" />
    </marker>
  </defs>
  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="193" y="12" width="975" height="252" rx="16" fill="#f7fcfb"
          stroke="#16756c" stroke-width="2" stroke-dasharray="8 6" />
    <rect x="213" y="0" width="470" height="26" rx="8" fill="#16756c" />
    <text x="229" y="18" font-size="15" font-weight="700" fill="#ffffff">Serwerownia ROPS · jeden komputer GB10 · Docker Compose</text>
    <rect x="6" y="70" width="160" height="92" rx="12" fill="#eaf6f4" stroke="#cfe4e0" />
    <text x="86" y="104" font-size="17" font-weight="700" fill="#10343a" text-anchor="middle">Przeglądarka</text>
    <text x="86" y="126" font-size="14" fill="#4a6266" text-anchor="middle">React + Vite,</text>
    <text x="86" y="144" font-size="14" fill="#4a6266" text-anchor="middle">build statyczny</text>
    <line x1="168" y1="116" x2="207" y2="116" stroke="#16756c" stroke-width="2.5" marker-end="url(#ar)" />
    <rect x="221" y="70" width="278" height="92" rx="12" fill="#ffffff" stroke="#cfe4e0" />
    <text x="360" y="104" font-size="17" font-weight="700" fill="#10343a" text-anchor="middle">Django REST</text>
    <text x="360" y="126" font-size="14" fill="#4a6266" text-anchor="middle">gunicorn · 7 modułów zadania</text>
    <text x="360" y="144" font-size="14" fill="#4a6266" text-anchor="middle">pod jednym /api/</text>
    <line x1="501" y1="116" x2="541" y2="116" stroke="#16756c" stroke-width="2.5" marker-end="url(#ar)" />
    <rect x="555" y="70" width="278" height="92" rx="12" fill="#ffffff" stroke="#cfe4e0" />
    <text x="694" y="100" font-size="17" font-weight="700" fill="#10343a" text-anchor="middle">Silnik rankingu</text>
    <text x="694" y="122" font-size="14" fill="#4a6266" text-anchor="middle">nasz kod: BM25 po 7 polach</text>
    <text x="694" y="140" font-size="14" fill="#4a6266" text-anchor="middle">+ 22 wątki pojęciowe</text>
    <line x1="835" y1="116" x2="875" y2="116" stroke="#16756c" stroke-width="2.5" marker-end="url(#ar)" />
    <rect x="889" y="70" width="262" height="92" rx="12" fill="#eaf6f4" stroke="#16756c" stroke-width="2" />
    <text x="1020" y="100" font-size="17" font-weight="700" fill="#10343a" text-anchor="middle">Kev — lokalnie</text>
    <text x="1020" y="122" font-size="14" fill="#4a6266" text-anchor="middle">model decyzyjny,</text>
    <text x="1020" y="140" font-size="14" fill="#4a6266" text-anchor="middle">werdykt obok rankingu</text>
    <line x1="694" y1="164" x2="694" y2="199" stroke="#16756c" stroke-width="2.5" marker-end="url(#ar)" />
    <line x1="640" y1="199" x2="640" y2="164" stroke="#16756c" stroke-width="2.5" marker-end="url(#ar)" />
    <rect x="357" y="201" width="620" height="54" rx="12" fill="#ffffff" stroke="#cfe4e0" />
    <text x="667" y="224" font-size="17" font-weight="700" fill="#10343a" text-anchor="middle">PostgreSQL 17 + pgvector</text>
    <text x="667" y="244" font-size="14" fill="#4a6266" text-anchor="middle">115 kart · indeks GIN po polskich rdzeniach · wektory LSA · licznik zapytań bez trafień</text>
    <text x="1163" y="283" font-size="14" font-weight="700" fill="#16756c" text-anchor="end">Poza tę ramkę nie wychodzi ani jedno zapytanie mieszkanki.</text>
  </g>
</svg>
